<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pago STOKIA</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0A0A0B; color:#F5F5F7;
         font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .card { background:#141419; border:1px solid #26262E; border-radius:18px;
          padding:28px 24px; max-width:420px; text-align:center; }
  .logo { font-size:22px; font-weight:800; letter-spacing:.14em; }
  .bolt { color:#FF7A00; }
  h1 { font-size:18px; margin:18px 0 8px; }
  p { color:#9A9AA5; font-size:14px; line-height:1.5; margin:0 0 18px; }
  .ok { color:#00C853; font-weight:700; }
  .wait { color:#FFB067; font-weight:700; }
  a { display:inline-block; margin-top:8px; padding:12px 22px; border-radius:12px;
      background:#FF7A00; color:#0A0A0B; font-weight:700; text-decoration:none; }
  small { display:block; margin-top:16px; color:#6B6B75; font-size:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="bolt">⚡</span> STOKIA</div>
    <h1>Pago procesado</h1>
    <p id="msg" class="wait">Estamos confirmando tu pago con Wompi…</p>
    <p><strong>Vuelve a la app</strong> y entra a <em>Plan Premium</em> → <em>Ya pagué, verificar</em>.</p>
    <a href="#" id="open">Abrir STOKIA</a>
    <small>Si el pago fue rechazado, no se hizo ningún cobro.</small>
  </div>
  <script>
    // Wompi devuelve el estado en el hash o en el query
    const params = new URLSearchParams(location.search + location.hash.replace('#','&'));
    const status = (params.get('status') || params.get('transaction.status') || '').toUpperCase();
    const msg = document.getElementById('msg');
    if (status === 'APPROVED') {
      msg.className = 'ok';
      msg.textContent = '¡Pago aprobado! Tu plan Premium se activará en segundos.';
    } else if (status === 'DECLINED' || status === 'VOIDED') {
      msg.className = 'wait';
      msg.textContent = 'El pago no se completó. No se hizo ningún cobro.';
    }
    document.getElementById('open').href = 'stokia://plan';
  </script>
</body>
</html>
